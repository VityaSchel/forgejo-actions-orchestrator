# Per-instance provider credentials.
# Install to /etc/systemd/system/forgejo-actions-orchestrator@<instance>.service.d/providers.conf
#
# Keep only the providers this instance's config names in a [[label]] block. systemd fails the
# unit at 243/CREDENTIALS if a LoadCredential= source file is missing, so an instance must not
# declare a provider it has no token for.

[Service]
LoadCredential=hetzner-token:/etc/forgejo-actions-orchestrator/credentials/%i/hetzner-token
LoadCredential=vultr-token:/etc/forgejo-actions-orchestrator/credentials/%i/vultr-token
LoadCredential=cherry-token:/etc/forgejo-actions-orchestrator/credentials/%i/cherry-token
LoadCredential=cherry-project-id:/etc/forgejo-actions-orchestrator/credentials/%i/cherry-project-id
LoadCredential=scaleway-token:/etc/forgejo-actions-orchestrator/credentials/%i/scaleway-token
LoadCredential=scaleway-project-id:/etc/forgejo-actions-orchestrator/credentials/%i/scaleway-project-id
LoadCredential=gcore-token:/etc/forgejo-actions-orchestrator/credentials/%i/gcore-token
LoadCredential=gcore-project-id:/etc/forgejo-actions-orchestrator/credentials/%i/gcore-project-id
