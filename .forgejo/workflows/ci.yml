name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: orchestrator-ci-${{ forgejo.event.pull_request.number || forgejo.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ["check", "hetzner"]
    timeout-minutes: 25
    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}
    env:
      PR_NUMBER: ${{ forgejo.event.pull_request.number }}
      PR_HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
      WORKSPACE: /opt/orchestrator-ci
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
      RUSTUP_VERSION: "1.29.0"
      RUSTUP_SHA256: "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10"
    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by PR code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          if [ -n "$PR_NUMBER" ]; then
            ref="refs/pull/${PR_NUMBER}/head"
            want="$PR_HEAD_SHA"
          else
            ref="$FORGEJO_REF"
            want="$FORGEJO_SHA"
          fi

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD
          [ -z "$want" ] || [ "$(git rev-parse HEAD)" = "$want" ] \
            || { echo "FATAL: head moved since the run was queued (want $want, got $(git rev-parse HEAD))"; exit 1; }

      - name: Install system packages
        run: |
          missing=()
          command -v cc >/dev/null 2>&1 || missing+=(gcc libc6-dev)
          command -v shellcheck >/dev/null 2>&1 || missing+=(shellcheck)
          if [ ${#missing[@]} -gt 0 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - name: Install the pinned toolchain
        run: |
          curl -fsSLo /tmp/rustup-init \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -q -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

          cd "$WORKSPACE"
          "$CARGO_HOME/bin/rustup" --quiet show active-toolchain

      - name: Format
        run: cd "$WORKSPACE" && cargo fmt --check

      - name: Clippy
        run: cd "$WORKSPACE" && cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cd "$WORKSPACE" && cargo test --locked

      - name: Shellcheck
        run: cd "$WORKSPACE" && shellcheck src/boot.sh deploy/build.sh
