[package]
name = "forgejo-actions-orchestrator"
version = "1.1.1"
edition = "2021"
rust-version = "1.86"
license = "MIT"
description = "Gives each queued Forgejo Actions job a disposable virtual machine"
repository = "https://git.hloth.dev/hloth/forgejo-actions-orchestrator"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = [
	"json",
	"rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = [
	"std",
	"parsing",
] }
tokio = { version = "1", features = [
	"macros",
	"rt-multi-thread",
	"signal",
	"time",
] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
strip = true
