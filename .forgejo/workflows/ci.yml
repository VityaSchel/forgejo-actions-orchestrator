name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: docker
    container:
      image: rust:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          apt-get update -y
          DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Shellcheck
        run: shellcheck src/boot.sh deploy/build.sh
