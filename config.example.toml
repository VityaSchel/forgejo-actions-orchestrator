# image = "d52b7e87-50f2-4ad0-a5f8-8b9f80591384"

#! Scaleway and Gcore bill the boot volume separately from the instance, from creation until
#! deletion, and destroy deletes the instance first. If the volume delete then fails the daemon
#! logs the zone and volume id, but no later sweep can see an orphan: check the provider's block
#! storage list after any destroy that alerted.
# lifetime_minutes = 90
# allowed_events = ["workflow_dispatch"]


