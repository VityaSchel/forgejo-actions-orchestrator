pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: rustfmt --config skip_children=true {staged_files}
      stage_fixed: true
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets
    rust-test:
      glob: "*.rs"
      run: cargo test --quiet
